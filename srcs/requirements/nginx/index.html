<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | klafi.42.fr</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
            background:
                radial-gradient(circle at top left, #3b82f6 0%, transparent 35%),
                radial-gradient(circle at bottom right, #8b5cf6 0%, transparent 35%),
                linear-gradient(135deg, #0f172a, #020617);
        }

        .background {
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: -1;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.04);
            animation: float 12s ease-in-out infinite;
        }

        .circle:nth-child(1){
            width:220px;
            height:220px;
            left:10%;
            top:15%;
        }

        .circle:nth-child(2){
            width:140px;
            height:140px;
            right:15%;
            top:20%;
            animation-delay:2s;
        }

        .circle:nth-child(3){
            width:300px;
            height:300px;
            right:8%;
            bottom:-80px;
            animation-delay:5s;
        }

        @keyframes float{
            0%,100%{
                transform:translateY(0px);
            }
            50%{
                transform:translateY(-20px);
            }
        }

        .card{
            width:min(90%,720px);
            padding:60px;
            border-radius:24px;
            text-align:center;

            background:rgba(255,255,255,.08);
            backdrop-filter:blur(16px);
            border:1px solid rgba(255,255,255,.15);

            box-shadow:
                0 20px 60px rgba(0,0,0,.45);
        }

        h1{
            font-size:clamp(2.8rem,7vw,4.6rem);
            margin-bottom:15px;
            letter-spacing:-2px;
        }

        .accent{
            background:linear-gradient(90deg,#60a5fa,#a78bfa,#f472b6);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }

        p{
            color:#d1d5db;
            font-size:1.15rem;
            line-height:1.8;
            margin-bottom:40px;
        }

        .url{
            display:inline-block;
            padding:14px 28px;
            border-radius:999px;
            background:linear-gradient(90deg,#2563eb,#7c3aed);
            color:white;
            text-decoration:none;
            font-weight:600;
            transition:.3s;
        }

        .url:hover{
            transform:translateY(-3px);
            box-shadow:0 12px 30px rgba(99,102,241,.4);
        }

        footer{
            margin-top:40px;
            color:#9ca3af;
            font-size:.9rem;
        }
    </style>
</head>

<body>

<div class="background">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
</div>

<div class="card">

    <h1>Welcome to <span class="accent">klafi.42.fr</span></h1>

    <p>
        Thank you for stopping by.<br>
        This website is where I build, experiment, and share projects,
        ideas, and everything I learn along the journey.
    </p>

    <a class="url" href="https://klafi.42.fr">
        Visit klafi.42.fr
    </a>

    <footer>
        Crafted with ❤️ by Kanan Lafi
    </footer>

</div>

</body>
</html>
